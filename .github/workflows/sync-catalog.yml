name: Sync new song metadata

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Archive spreadsheet scores"]
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: catalog-sync
  cancel-in-progress: false

jobs:
  sync:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Download updated score archive
        if: ${{ github.event_name == 'workflow_run' }}
        uses: actions/download-artifact@v4
        with:
          name: score-archive
          path: src/data
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Check for score archive changes
        id: data-check
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || \
            ! git diff --quiet -- src/data/generated-scores.json; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: ${{ steps.data-check.outputs.should-run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        if: ${{ steps.data-check.outputs.should-run == 'true' }}
        run: npm ci

      - name: Complete maimaidx.jp certificate chain
        if: ${{ steps.data-check.outputs.should-run == 'true' }}
        run: |
          set -euo pipefail
          leaf_certificate="$RUNNER_TEMP/maimaidx-leaf.pem"
          issuer_certificate="$RUNNER_TEMP/maimaidx-issuer.cer"
          issuer_pem="$RUNNER_TEMP/maimaidx-issuer.pem"
          ca_bundle="$RUNNER_TEMP/maimai-ca-bundle.pem"

          openssl s_client \
            -showcerts \
            -connect maimaidx.jp:443 \
            -servername maimaidx.jp </dev/null 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/{copy=1} copy{print} /END CERTIFICATE/{exit}' \
            > "$leaf_certificate"

          issuer_url="$(openssl x509 -in "$leaf_certificate" -noout -text \
            | sed -n 's/.*CA Issuers - URI:\(.*\)/\1/p' \
            | head -n 1)"

          if [ -z "$issuer_url" ]; then
            echo "The jacket server certificate did not provide an issuer URL."
            exit 1
          fi

          curl --fail --location --silent --show-error \
            "$issuer_url" \
            --output "$issuer_certificate"

          openssl x509 \
            -inform DER \
            -in "$issuer_certificate" \
            -out "$issuer_pem"

          cat /etc/ssl/certs/ca-certificates.crt "$issuer_pem" > "$ca_bundle"
          echo "CURL_CA_BUNDLE=$ca_bundle" >> "$GITHUB_ENV"
          echo "NODE_EXTRA_CA_CERTS=$ca_bundle" >> "$GITHUB_ENV"

      - name: Sync metadata for new songs
        if: ${{ steps.data-check.outputs.should-run == 'true' }}
        run: npm run catalog:sync
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}

      - name: Validate generated data
        if: ${{ steps.data-check.outputs.should-run == 'true' }}
        run: npm run data:validate

      - name: Commit score and catalog data
        if: ${{ steps.data-check.outputs.should-run == 'true' }}
        run: |
          if git diff --quiet -- \
            src/data/generated-scores.json \
            src/data/generated-catalog.json; then
            echo "Score and song data are already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/data/generated-scores.json \
            src/data/generated-catalog.json
          git commit -m "Add new score data"
          git pull --rebase origin main
          git push
