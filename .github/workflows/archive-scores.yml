name: Archive spreadsheet scores

on:
  workflow_dispatch:
  schedule:
    # GitHub cron uses UTC. These cover midnight Eastern in both EST and EDT.
    - cron: "0 4 * * 0"
    - cron: "0 5 * * 0"

permissions:
  contents: read

concurrency:
  group: score-archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check whether this is midnight Eastern
        id: schedule-check
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" != "schedule" ] || [ "$(TZ=America/New_York date +%u-%H)" = "7-00" ]; then
            echo "should-run=true" >> "$GITHUB_OUTPUT"
          else
            echo "should-run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        if: ${{ steps.schedule-check.outputs.should-run == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.1
          cache: npm

      - name: Install dependencies
        if: ${{ steps.schedule-check.outputs.should-run == 'true' }}
        run: npm ci

      - name: Archive new spreadsheet rows
        if: ${{ steps.schedule-check.outputs.should-run == 'true' }}
        run: npm run scores:sync
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          GOOGLE_SPREADSHEET_ID: ${{ vars.GOOGLE_SPREADSHEET_ID }}
          GOOGLE_SHEET_NAME: ${{ vars.GOOGLE_SHEET_NAME }}

      - name: Ensure alias handoff exists
        run: |
          if [ ! -f .sync/song-aliases.json ]; then
            mkdir -p .sync
            echo '[]' > .sync/song-aliases.json
          fi

      - name: Pass score archive to metadata workflow
        uses: actions/upload-artifact@v4
        with:
          name: score-archive
          path: |
            src/data/generated-scores.json
            .sync/song-aliases.json
          if-no-files-found: error
          retention-days: 1
